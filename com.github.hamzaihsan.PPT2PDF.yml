app-id: com.github.hamzaihsan.PPT2PDF
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: ppt2pdf-gtk
finish-args:
  # UI
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Network (not necessarily needed, but standard)
  - --share=network
  # Filesystem access for inputs/outputs
  - --filesystem=host
  # Required to use LibreOffice from the host via flatpak-spawn
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: ppt2pdf
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # PySide6 is not included in the GNOME runtime.
      - python3 -m pip install --prefix=/app --no-cache-dir --disable-pip-version-check 'PySide6>=6.8.0'
      # Install the python script
      - install -Dm755 ppt2pdf-gtk.py /app/bin/ppt2pdf-gtk
      # Install desktop file
      - install -Dm644 com.github.hamzaihsan.PPT2PDF.desktop /app/share/applications/com.github.hamzaihsan.PPT2PDF.desktop
      # Install icon
      - install -Dm644 com.github.hamzaihsan.PPT2PDF.svg /app/share/icons/hicolor/scalable/apps/com.github.hamzaihsan.PPT2PDF.svg
    sources:
      - type: file
        path: ppt2pdf-gtk.py
      - type: file
        path: com.github.hamzaihsan.PPT2PDF.desktop
      - type: file
        path: com.github.hamzaihsan.PPT2PDF.svg
